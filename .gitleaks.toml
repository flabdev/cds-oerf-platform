title = "cds-oerf-platform"

[extend]
useDefault = true

[allowlist]
description = "Fixtures, seed tokens, IAM docs, and generated caches"
paths = [
  '''tests[/\\]''',
  '''sim[/\\]seed[/\\]''',
  '''docs[/\\]''',
  '''(?:^|[/\\])\.jsii-cache(?:-ssm)?(?:[/\\]|$)''',
  '''(?:^|[/\\])\.venv(?:[/\\]|$)''',
  '''(?:^|[/\\])venv(?:[/\\]|$)''',
  '''(?:^|[/\\])node_modules(?:[/\\]|$)''',
  '''(?:^|[/\\])cdk\.out(?:[/\\]|$)''',
  '''(?:^|[/\\])\.pytest_cache(?:[/\\]|$)''',
  '''(?:^|[/\\])\.ruff_cache(?:[/\\]|$)''',
  '''(?:^|[/\\])__pycache__(?:[/\\]|$)''',
  '''\.egg-info(?:[/\\]|$)''',
]
regexes = [
  '''\$\{PHONE_[A-Z0-9_]+\}''',
]
