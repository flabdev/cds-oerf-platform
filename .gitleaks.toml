title = "cds-oerf-platform"

[extend]
useDefault = true

[allowlist]
description = "Generated caches and seed phone tokens"
paths = [
  '''tests[/\\]unit[/\\]security[/\\]test_synth_secrets\.py$''',
  '''(?:^|[/\\])pr-32\.diff$''',
  '''(?:^|[/\\])my-pr-32\.diff$''',
  '''(?:^|[/\\])\.jsii-cache(?:-ssm)?(?:[/\\]|$)''',
  '''(?:^|[/\\])\.venv(?:[/\\]|$)''',
  '''(?:^|[/\\])venv(?:[/\\]|$)''',
  '''(?:^|[/\\])node_modules(?:[/\\]|$)''',
  '''(?:^|[/\\])cdk\.out(?:[/\\]|$)''',
  '''(?:^|[/\\])\.pytest_cache(?:[/\\]|$)''',
  '''(?:^|[/\\])\.ruff_cache(?:[/\\]|$)''',
  '''(?:^|[/\\])__pycache__(?:[/\\]|$)''',
  '''\.egg-info(?:[/\\]|$)''',
]
regexes = [
  '''\$\{PHONE_[A-Z0-9_]+\}''',
]
