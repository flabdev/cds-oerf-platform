[project]
name = "cds-oerf-platform"
version = "0.1.0"
description = "Operational Exception Resolution Framework"
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib>=2.0.0",
    "constructs>=10.0.0,<11.0.0",
    "jsonschema>=4",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oerf*", "sim*", "domains*"]

[tool.setuptools.package-data]
domains = ["*/*.json"]
sim = ["seed/*/*.json", "seed/*/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true
