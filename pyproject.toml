[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cds-oerf-platform"
version = "0.1.0"
description = "Operational Exception Resolution Framework"
requires-python = ">=3.11"
dependencies = [
    "aws-cdk-lib>=2.0.0",
    "boto3>=1.34",
    "constructs>=10.0.0,<11.0.0",
    "jsonschema>=4",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# OERF-206: the AgentCore runtime image installs this extra. It is not a
# dependency of the Lambdas or of the unit suite, which runs without the SDK and
# falls back to the rules-only advisory.
runtime-agent = [
    "strands-agents>=1.0",
]

[tool.setuptools.packages.find]
include = ["infra*", "domains*", "sim*", "oerf*"]

[tool.setuptools.package-data]
domains = ["*/*.json"]
sim = ["seed/*/*.json", "seed/*/*/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast tests with no AWS (default)",
    "integration: multi-component tests with fakes, no AWS",
    "e2e: scenario tests with fakes, no AWS",
    "security: security regression tests, no AWS",
    "aws: needs real AWS credentials; opt-in only",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
combine-as-imports = true
