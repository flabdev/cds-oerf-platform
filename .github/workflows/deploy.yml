name: Deploy OERF

# Develop copy of deploy.yml. It deploys only the dev stage (stacks named *-dev)
# from develop. main keeps its own copy of this file unchanged.
# Run it from Actions > Deploy OERF > Run workflow > Use workflow from: develop.
# Until the dev stage is first set up, feature/dev-stage-environment may also
# deploy. Remove that branch here and from the dev environment's branch rules in
# the PR that merges it into develop.
# The real guard is outside this file: the dev environment's branch rules and a
# dev deploy role that can change only stacks named *-dev.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: diff = read-only change set; deploy = cdk deploy
        type: choice
        options: [diff, deploy]
        default: diff
      agentcore:
        description: Deploy the AgentCore runtime (builds the ARM64 image)
        type: boolean
        default: true
      dashboard:
        description: Deploy the dashboard stack
        type: boolean
        default: true
      channels_live:
        description: Turn on live channel and Bedrock calls
        type: boolean
        default: false
      seed_demo_devices:
        description: Write demo DEVICE rows from the seed files
        type: boolean
        default: false

# One in-flight deploy per stage. main uses cdk-deploy-us-east-1.
concurrency:
  group: cdk-deploy-us-east-1-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy dev stage via CDK
    runs-on: ubuntu-latest
    # The OIDC subject becomes repo:<org>/<repo>:environment:dev.
    # OerfGitHubDeployRole-dev trusts only that subject.
    environment: dev
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Require develop
        run: |
          set -euo pipefail
          case "${GITHUB_REF}" in
            refs/heads/develop) ;;
            # Temporary: the branch that sets up the dev stage. Remove on merge.
            refs/heads/feature/dev-stage-environment) ;;
            *)
              echo "::error::The dev stage deploys from develop only."
              exit 1
              ;;
          esac
          echo "Deploying ${GITHUB_REF_NAME} to the dev stage" >> "${GITHUB_STEP_SUMMARY}"

      - name: Require deploy variables
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          DEPLOY_ROLE_NAME: ${{ vars.DEPLOY_ROLE_NAME }}
        run: |
          set -euo pipefail
          if [[ ! "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo "::error::Variable AWS_ACCOUNT_ID must be a 12-digit account id."
            exit 1
          fi
          if [[ ! "${DEPLOY_ROLE_NAME}" =~ ^[A-Za-z0-9+=,.@_-]{1,64}$ ]]; then
            echo "::error::Environment variable DEPLOY_ROLE_NAME (dev) must be an IAM role name."
            exit 1
          fi
          if [[ "${DEPLOY_ROLE_NAME}" != *-dev ]]; then
            echo "::error::DEPLOY_ROLE_NAME must be the dev role (ends in -dev), not main's role."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # AgentCore publishes a linux/arm64 image. ubuntu-latest is x86_64.
      - name: Set up QEMU
        if: ${{ inputs.agentcore == true || inputs.agentcore == 'true' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        if: ${{ inputs.agentcore == true || inputs.agentcore == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          platforms: linux/arm64
          cache-binary: false

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.DEPLOY_ROLE_NAME }}
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install -g aws-cdk@2.1145.0
          pip install -e .

      - name: Assemble CDK context
        env:
          AGENTCORE: ${{ (inputs.agentcore == true || inputs.agentcore == 'true') && 'true' || 'false' }}
          DASHBOARD: ${{ (inputs.dashboard == true || inputs.dashboard == 'true') && 'true' || 'false' }}
          CHANNELS_LIVE: ${{ (inputs.channels_live == true || inputs.channels_live == 'true') && 'true' || 'false' }}
          SEED_DEMO_DEVICES: ${{ (inputs.seed_demo_devices == true || inputs.seed_demo_devices == 'true') && 'true' || 'false' }}
          PHONE_NUMBER_ID: ${{ vars.WA_PHONE_NUMBER_ID }}
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          SHARED_INBOUND_TOPIC_ARN: ${{ vars.SHARED_INBOUND_TOPIC_ARN }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for value in "${PHONE_NUMBER_ID}" "${ALARM_EMAIL}" "${SHARED_INBOUND_TOPIC_ARN}"; do
            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "::error::Variables must be a single line."
              exit 1
            fi
          done
          {
            printf '%s\n' "stage=dev"
            printf '%s\n' "account=${AWS_ACCOUNT_ID}"
            printf '%s\n' "agentcore:enabled=${AGENTCORE}"
            printf '%s\n' "dashboard:enabled=${DASHBOARD}"
            if [[ "${DASHBOARD}" == "true" ]]; then
              printf '%s\n' "desk:publish=true"
            fi
            printf '%s\n' "channels:live=${CHANNELS_LIVE}"
            if [[ "${SEED_DEMO_DEVICES}" == "true" ]]; then
              printf '%s\n' "demo:seedDevices=true"
            fi
            # Never whatsapp:wabaId in dev. The WABA has one event destination,
            # owned by main. Dev subscribes to main's inbound topic instead (A5).
            if [[ -n "${SHARED_INBOUND_TOPIC_ARN}" ]]; then
              printf '%s\n' "whatsapp:sharedInboundTopicArn=${SHARED_INBOUND_TOPIC_ARN}"
            fi
            if [[ -n "${PHONE_NUMBER_ID}" ]]; then
              printf '%s\n' "whatsapp:phoneNumberId=${PHONE_NUMBER_ID}"
            fi
            if [[ -n "${ALARM_EMAIL}" ]]; then
              printf '%s\n' "alarms:email=${ALARM_EMAIL}"
            fi
          } > "${RUNNER_TEMP}/cdk-context-args"
          if grep -q '^whatsapp:wabaId=' "${RUNNER_TEMP}/cdk-context-args"; then
            echo "::error::whatsapp:wabaId must not be set for the dev stage."
            exit 1
          fi

      # desk:publish reads web/dist. Build before cdk ls, which synthesizes.
      # Node is web/.nvmrc. This does not add permissions to the deploy role.
      - name: Set up Node
        if: ${{ inputs.dashboard == true || inputs.dashboard == 'true' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build the desk
        if: ${{ inputs.dashboard == true || inputs.dashboard == 'true' }}
        working-directory: web
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm run check:build

      # Fails unless every stack this app would touch is a dev stack.
      - name: Guard - dev stacks only
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r entry || [[ -n "${entry}" ]]; do
            args+=(-c "${entry}")
          done < "${RUNNER_TEMP}/cdk-context-args"
          cdk ls "${args[@]}" > "${RUNNER_TEMP}/stacks.txt"
          cat "${RUNNER_TEMP}/stacks.txt"
          if [[ ! -s "${RUNNER_TEMP}/stacks.txt" ]]; then
            echo "::error::cdk ls returned no stacks."
            exit 1
          fi
          if grep -qv -- '-dev$' "${RUNNER_TEMP}/stacks.txt"; then
            echo "::error::Non-dev stack in the app. Refusing to touch main's stacks."
            exit 1
          fi

      # Evidence for comparing this run with a laptop deploy (A0).
      - name: Record run environment
        run: |
          set -euo pipefail
          {
            echo "### Deploy environment"
            echo '```'
            echo "mode: ${{ inputs.mode }}"
            echo "branch: ${GITHUB_REF_NAME}"
            echo "commit: ${GITHUB_SHA}"
            echo "cdk: $(cdk --version)"
            echo "python: $(python --version 2>&1)"
            echo "pip: $(pip --version)"
            echo "docker: $(docker --version 2>/dev/null || echo none)"
            echo "context:"
            sed 's/^/  /' "${RUNNER_TEMP}/cdk-context-args"
            echo "stacks:"
            sed 's/^/  /' "${RUNNER_TEMP}/stacks.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: CDK diff
        run: |
          set -euo pipefail
          # This CLI exits 1 when the templates differ. --fail-on never still
          # prints the change set; synthesis and credential errors still fail.
          args=(--all --fail-on never)
          while IFS= read -r entry || [[ -n "${entry}" ]]; do
            args+=(-c "${entry}")
          done < "${RUNNER_TEMP}/cdk-context-args"
          cdk diff "${args[@]}"

      - name: CDK deploy
        if: ${{ inputs.mode == 'deploy' }}
        run: |
          set -euo pipefail
          args=(--all --require-approval never)
          while IFS= read -r entry || [[ -n "${entry}" ]]; do
            args+=(-c "${entry}")
          done < "${RUNNER_TEMP}/cdk-context-args"
          cdk deploy "${args[@]}"

      # OerfGitHubDeployRole-dev cannot call CloudFormation. It can assume
      # cdk-oerfdev-deploy-role, whose DescribeStacks allow covers *-dev stacks.
      # No new permission is added. The log prints hostnames only.
      - name: Smoke the desk
        if: ${{ inputs.mode == 'deploy' && (inputs.dashboard == true || inputs.dashboard == 'true') }}
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          role_arn="arn:aws:iam::${AWS_ACCOUNT_ID}:role/cdk-oerfdev-deploy-role-${AWS_ACCOUNT_ID}-us-east-1"
          creds="$(aws sts assume-role \
            --role-arn "${role_arn}" \
            --role-session-name oerf-desk-smoke \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)"
          read -r key secret token <<<"${creds}"
          export AWS_ACCESS_KEY_ID="${key}" AWS_SECRET_ACCESS_KEY="${secret}" AWS_SESSION_TOKEN="${token}"
          dashboard_url="$(aws cloudformation describe-stacks \
            --stack-name OerfApiStack-dev \
            --query "Stacks[0].Outputs[?OutputKey=='DashboardUrl'].OutputValue | [0]" \
            --output text)"
          dashboard_url="${dashboard_url%/}"
          code="$(curl -sS --retry 6 --retry-delay 5 --retry-all-errors \
            -o /dev/null -w "%{http_code}" "${dashboard_url}/")"
          if [[ "${code}" != "200" ]]; then
            echo "::error::DashboardUrl returned HTTP ${code}"
            exit 1
          fi
          echo "DashboardUrl returned HTTP 200"
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors \
            -o "${RUNNER_TEMP}/desk-config.json" \
            "${dashboard_url}/config.json"
          python3 - "${RUNNER_TEMP}/desk-config.json" <<'PY'
          import json
          import sys
          from urllib.parse import urlparse
          try:
              data = json.loads(open(sys.argv[1], encoding="utf-8").read())
          except json.JSONDecodeError:
              sys.exit("config.json is not JSON")
          api = str(data.get("apiUrl") or "").strip()
          client = str(data.get("userPoolClientId") or "").strip()
          ws = str(data.get("wsUrl") or "").strip()
          domain = str(data.get("cognitoDomain") or "").strip()
          if not api or not client:
              sys.exit("config.json apiUrl or userPoolClientId is empty")
          def host(value):
              if "://" in value:
                  return urlparse(value).hostname or ""
              return value.split("/")[0]
          print("desk config hosts: api=%s ws=%s cognito=%s" % (host(api), host(ws), host(domain)))
          PY

      - name: First failed CloudFormation event
        if: ${{ failure() && inputs.mode == 'deploy' }}
        run: |
          set -uo pipefail
          for stack in $(cat "${RUNNER_TEMP}/stacks.txt"); do
            echo "== ${stack}"
            aws cloudformation describe-stack-events --stack-name "${stack}" \
              --query "StackEvents[?contains(ResourceStatus,'FAILED')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatusReason]" \
              --output text 2>/dev/null | tail -n 5 || true
          done
