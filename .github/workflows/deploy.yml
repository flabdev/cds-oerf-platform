name: Deploy CDK Infrastructure

on:
  workflow_dispatch:

permissions:
  id-token: write   # Required for requesting the JWT from AWS OIDC
  contents: read    # Required for actions/checkout

jobs:
  deploy:
    name: Deploy to AWS via CDK
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Debug OIDC Token Claims
        run: |
          curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | \
            jq -r '.value | split(".")[1] | @base64d | fromjson | {sub, aud, iss, repository, ref}'

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::906048429638:role/OerfGitHubDeployRole
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          npm install -g aws-cdk
          pip install -e .

      - name: Build web dashboard
        run: |
          cd web
          npm ci || npm install
          npm run build
          cd ..

      - name: CDK Deploy
        run: |
          cdk deploy --all --require-approval never
