name: Deploy OERF

on:
  workflow_dispatch:
    inputs:
      agentcore:
        description: Deploy the AgentCore runtime (builds the ARM64 image)
        type: boolean
        default: true
      dashboard:
        description: Deploy the dashboard stack
        type: boolean
        default: true
      channels_live:
        description: Turn on live channel and Bedrock calls
        type: boolean
        default: false
      waba_id:
        description: WhatsApp Business Account id (waba-...). Empty uses repository variable WABA_ID.
        type: string
        default: ""
      seed_demo_devices:
        description: Write demo DEVICE rows from the seed files
        type: boolean
        default: true
      phone_number_id:
        description: WhatsApp phone number id. Empty uses repository variable WA_PHONE_NUMBER_ID.
        type: string
        default: ""
      alarm_email:
        description: Alarm topic email. Empty uses repository variable ALARM_EMAIL.
        type: string
        default: ""

# One in-flight deploy for this region. A second run waits.
concurrency:
  group: cdk-deploy-us-east-1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to AWS via CDK
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        shell: bash

    steps:
      - name: Require main
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error::CDK deploy runs only for refs/heads/main."
            exit 1
          fi

      - name: Require deploy repository variables
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          DEPLOY_ROLE_NAME: ${{ vars.DEPLOY_ROLE_NAME }}
        run: |
          set -euo pipefail
          if [[ ! "${AWS_ACCOUNT_ID}" =~ ^[0-9]{12}$ ]]; then
            echo "::error::Repository variable AWS_ACCOUNT_ID must be a 12-digit account id."
            exit 1
          fi
          if [[ ! "${DEPLOY_ROLE_NAME}" =~ ^[A-Za-z0-9+=,.@_-]{1,64}$ ]]; then
            echo "::error::Repository variable DEPLOY_ROLE_NAME must be an IAM role name."
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # AgentCore publishes a linux/arm64 image. ubuntu-latest is x86_64.
      - name: Set up QEMU
        if: ${{ inputs.agentcore == true || inputs.agentcore == 'true' }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          cache-image: false

      - name: Set up Docker Buildx
        if: ${{ inputs.agentcore == true || inputs.agentcore == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
          platforms: linux/arm64
          cache-binary: false

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.DEPLOY_ROLE_NAME }}
          aws-region: us-east-1

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install -g aws-cdk@2.1145.0
          pip install -e .

      - name: Assemble CDK context
        env:
          AGENTCORE: ${{ (inputs.agentcore == true || inputs.agentcore == 'true') && 'true' || 'false' }}
          DASHBOARD: ${{ (inputs.dashboard == true || inputs.dashboard == 'true') && 'true' || 'false' }}
          CHANNELS_LIVE: ${{ (inputs.channels_live == true || inputs.channels_live == 'true') && 'true' || 'false' }}
          SEED_DEMO_DEVICES: ${{ (inputs.seed_demo_devices == true || inputs.seed_demo_devices == 'true') && 'true' || 'false' }}
          WABA_ID: ${{ inputs.waba_id }}
          WABA_ID_VAR: ${{ vars.WABA_ID }}
          PHONE_NUMBER_ID: ${{ inputs.phone_number_id }}
          PHONE_NUMBER_ID_VAR: ${{ vars.WA_PHONE_NUMBER_ID }}
          ALARM_EMAIL: ${{ inputs.alarm_email }}
          ALARM_EMAIL_VAR: ${{ vars.ALARM_EMAIL }}
        run: |
          set -euo pipefail
          resolve() {
            local input="$1"
            local fallback="$2"
            if [[ -n "${input}" ]]; then
              printf '%s' "${input}"
            else
              printf '%s' "${fallback}"
            fi
          }
          waba_id="$(resolve "${WABA_ID}" "${WABA_ID_VAR}")"
          phone_number_id="$(resolve "${PHONE_NUMBER_ID}" "${PHONE_NUMBER_ID_VAR}")"
          alarm_email="$(resolve "${ALARM_EMAIL}" "${ALARM_EMAIL_VAR}")"
          for value in "${waba_id}" "${phone_number_id}" "${alarm_email}"; do
            if [[ "${value}" == *$'\n'* || "${value}" == *$'\r'* ]]; then
              echo "::error::waba_id, phone_number_id, and alarm_email must be a single line."
              exit 1
            fi
          done
          {
            printf '%s\n' "agentcore:enabled=${AGENTCORE}"
            printf '%s\n' "dashboard:enabled=${DASHBOARD}"
            printf '%s\n' "channels:live=${CHANNELS_LIVE}"
            if [[ "${SEED_DEMO_DEVICES}" == "true" ]]; then
              printf '%s\n' "demo:seedDevices=true"
            fi
            if [[ -n "${waba_id}" ]]; then
              printf '%s\n' "whatsapp:wabaId=${waba_id}"
            fi
            if [[ -n "${phone_number_id}" ]]; then
              printf '%s\n' "whatsapp:phoneNumberId=${phone_number_id}"
            fi
            if [[ -n "${alarm_email}" ]]; then
              printf '%s\n' "alarms:email=${alarm_email}"
            fi
          } > "${RUNNER_TEMP}/cdk-context-args"

      - name: CDK diff
        run: |
          set -euo pipefail
          # This CLI exits 1 when the templates differ. --fail-on never still
          # prints the change set; synthesis and credential errors still fail.
          args=(--all --fail-on never)
          while IFS= read -r entry || [[ -n "${entry}" ]]; do
            args+=(-c "${entry}")
          done < "${RUNNER_TEMP}/cdk-context-args"
          cdk diff "${args[@]}"

      - name: CDK deploy
        run: |
          set -euo pipefail
          args=(--all --require-approval never)
          while IFS= read -r entry || [[ -n "${entry}" ]]; do
            args+=(-c "${entry}")
          done < "${RUNNER_TEMP}/cdk-context-args"
          cdk deploy "${args[@]}"
